<!DOCTYPE html>
<html>

<head>

<title>Detect Deepfake Image</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family: Arial;
background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
text-align:center;
}

/* 🔥 CONTAINER */
.container{
width:500px;
margin:80px auto;
background:white;
color:black;
padding:35px;
border-radius:15px;
box-shadow:0 20px 50px rgba(0,0,0,0.4);
transition:0.3s;
animation:fadeIn 0.8s ease;
}

/* TITLE */
h1{
margin-bottom:20px;
font-size:28px;
letter-spacing:0.5px;
}

/* 📦 UPLOAD BOX */
.upload-box{
border:2px dashed #ccc;
padding:35px;
border-radius:12px;
margin-bottom:20px;
transition:0.3s;
cursor:pointer;
}

/* HOVER EFFECT */
.upload-box:hover{
border-color:#28a745;
background:#f9f9f9;
transform:scale(1.02);
}

/* FILE INPUT */
input[type="file"]{
margin-top:10px;
}

/* 🎯 BUTTON */
button{
margin-top:20px;
padding:12px 30px;
background:#28a745;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
transition:0.3s;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

button:hover{
background:#1e7e34;
transform:translateY(-2px) scale(1.03);
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* 🖼️ PREVIEW */
.preview{
margin-top:20px;
}

img{
max-width:100%;
border-radius:10px;
margin-top:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
transition:0.3s;
}

/* IMAGE HOVER */
img:hover{
transform:scale(1.02);
}

/* 📊 RESULT BOX */
.result{
margin-top:25px;
font-size:18px;
font-weight:bold;
padding:15px;
border-radius:10px;
background:#f1f1f1;
animation:fadeIn 0.6s ease;
}

/* ✨ FADE ANIMATION */
@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>

<script>

/* IMAGE PREVIEW */
function previewImage(event){
const image = document.getElementById("preview-image");
image.src = URL.createObjectURL(event.target.files[0]);
image.style.display = "block";
}

</script>

</head>

<body>

{% include "navbar.html" %}

<div class="container">

<h1>Upload Image for Deepfake Detection</h1>

<form action="/detect_image" method="POST" enctype="multipart/form-data">

<div class="upload-box">
<p>Select an image file</p>
<input type="file" name="image" accept="image/*" onchange="previewImage(event)" required>
</div>

<div class="preview">
<img id="preview-image" style="display:none;">
</div>

<button type="submit">Detect Image</button>

</form>

{% if result %}

<div class="result">
Prediction: {{ result }}
<br><br>
Fake: {{ fake }} %
<br>
