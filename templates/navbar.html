<!DOCTYPE html>

<style>

/* ===== NAVBAR ===== */
.navbar {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 20px;
    padding: 12px 20px;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);

    overflow-x: auto;
    white-space: nowrap;
}

/* ===== LEFT (LOGO) ===== */
.left {
    flex: 1;
}

.logo {
    color: #00e6e6;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 0 0 10px #00e6e6;
}

/* ===== CENTER MENU ===== */
.center {
    flex: 2;
    display: flex;
    justify-content: center;
}

.nav-links {
    list-style: none;
    display: flex;
    gap: 10px;
    flex-wrap: nowrap;
}

.nav-links li {
    flex-shrink: 0;
}

/* LINKS */
.nav-links li a {
    color: white;
    text-decoration: none;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 15px;
    white-space: nowrap;
}

.nav-links li a:hover {
    background: #00e6e6;
    color: black;
}

/* ===== RIGHT SECTION ===== */
.right {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    flex: 1;
}

/* BUTTONS */
.toggle-btn,
.logout {
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.toggle-btn {
    height: 32px;
    padding: 0;
    background: #00c6ff;
    border: none;
    border-radius: 15px;
    color: white;
    cursor: pointer;
}

.logout {
    height: 32px;
    padding: 0 14px;
    background-color: red;
    color: white;
}

</style>

</head>

    <div class="logo">
        <span>DeepFake</span> AI Detector
    </div>
