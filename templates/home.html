<!DOCTYPE html>
<html>

<head>
<title>AI Deepfake Detection</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI', sans-serif;
}

/* 🌌 ENHANCED SOFT GRADIENT */
body{
background:
radial-gradient(circle at 20% 20%, #0f172a, #020617),
radial-gradient(circle at 80% 80%, rgba(56,189,248,0.08), transparent 40%);
color:white;
overflow-x:hidden;
position:relative;
}

/* GRID */
body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:
linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
background-size:50px 50px;
}

/* HERO */
.hero{
position:relative;
z-index:2;
padding:80px 60px;
width:60%;
animation: fadeUp 1s ease;
}

/* TITLE */
.hero h1{
font-size:70px;
font-weight:900;
line-height:1.2;
animation: fadeUp 1s ease;
}

.hero span{
color:#38bdf8;
}

/* TEXT */
.hero p{
margin-top:20px;
font-size:18px;
color:#94a3b8;
animation: fadeUp 1.4s ease;
}

/* BUTTON */
.cta-btn{
margin-top:30px;
padding:14px 35px;
border:none;
border-radius:30px;
background:linear-gradient(135deg,#38bdf8,#2563eb);
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
box-shadow:0 0 20px rgba(56,189,248,0.5);
animation: fadeUp 1.8s ease;
}

.cta-btn:hover{
transform:scale(1.1);
box-shadow:0 0 35px rgba(56,189,248,0.9);
}

/* FEATURES */
.features{
display:flex;
gap:20px;
margin-top:50px;
}

.feature-card{
background:rgba(255,255,255,0.05);
padding:20px;
border-radius:15px;
width:180px;
text-align:center;
backdrop-filter:blur(15px);
transition:0.3s;
animation: floatBox 6s ease-in-out infinite;
}

.feature-card:hover{
transform:translateY(-10px) scale(1.05);
}

/* FLOATING PANEL */
.floating-panel{
position:absolute;
right:60px;
top:120px;
display:flex;
flex-direction:column;
gap:25px;
z-index:2;
}

/* CARD */
.card{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
padding:20px;
border-radius:18px;
width:260px;
transition:0.3s;
animation: floatBox 7s ease-in-out infinite;
}

.card:hover{
transform:translateY(-10px) scale(1.05);
}

/* PROGRESS */
.progress{
height:8px;
background:#1e293b;
border-radius:10px;
margin:10px 0;
overflow:hidden;
}

.red{background:#ef4444;height:100%;width:70%;}
.green{background:#22c55e;height:100%;width:50%;}

/* GRAPH */
.graph{
display:flex;
gap:6px;
height:60px;
align-items:flex-end;
}

.graph div{
width:10px;
background:#38bdf8;
border-radius:5px;
animation: grow 1.5s ease;
}

.graph div:nth-child(1){height:30%;}
.graph div:nth-child(2){height:60%;}
.graph div:nth-child(3){height:40%;}
.graph div:nth-child(4){height:70%;}
.graph div:nth-child(5){height:50%;}

/* ✨ PARTICLES */
.particle{
position:absolute;
width:3px;
height:3px;
background:#38bdf8;
border-radius:50%;
opacity:0.6;
animation: floatUp linear infinite;
}

@keyframes floatUp{
0%{transform:translateY(0); opacity:0;}
50%{opacity:1;}
100%{transform:translateY(-600px); opacity:0;}
}

/* 🎬 ANIMATIONS */
@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes floatBox{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-8px);}
}

@keyframes grow{
from{height:0;}
}

/* MOBILE */
@media (max-width: 1024px){

.hero{
width:100%;
padding:60px 30px;
text-align:center;
}

.hero h1{font-size:48px;}
.hero p{font-size:16px;}

.features{
flex-direction:column;
align-items:center;
}

.feature-card{width:90%;}

.floating-panel{
position:relative;
top:auto;
right:auto;
margin:40px auto;
align-items:center;
}

.card{width:90%;}
}

@media (max-width: 600px){
.hero h1{font-size:36px;}
.cta-btn{width:80%;}
}

</style>

</head>

<body>

{% include "navbar.html" %}

<!-- PARTICLES -->
<div class="particle" style="left:10%; bottom:0; animation-duration:8s;"></div>
<div class="particle" style="left:25%; bottom:0; animation-duration:10s;"></div>
<div class="particle" style="left:40%; bottom:0; animation-duration:7s;"></div>
<div class="particle" style="left:55%; bottom:0; animation-duration:9s;"></div>
<div class="particle" style="left:70%; bottom:0; animation-duration:11s;"></div>
<div class="particle" style="left:85%; bottom:0; animation-duration:8s;"></div>

<!-- HERO -->
<div class="hero">

<h1>
AI <span id="typing"></span>
</h1>

<p>
Detect manipulated images and videos using advanced AI technology.<br>
Fast, accurate, and reliable.
</p>

<a href="/detect_image">
<button class="cta-btn">Start Detection</button>
</a>

<!-- FEATURES -->
<div class="features">

<div class="feature-card">
<h3>⚡ Fast</h3>
<p>Instant results</p>
</div>

<div class="feature-card">
<h3>🧠 AI Powered</h3>
<p>Deep learning model</p>
</div>

<div class="feature-card">
<h3>🔒 Secure</h3>
<p>Safe processing</p>
</div>

</div>

</div>

<!-- SIDE PANEL -->
<div class="floating-panel">

<div class="card">
<h3>Detection Ratio</h3>
<div class="progress"><div class="red"></div></div>
<div class="progress"><div class="green"></div></div>
</div>

<div class="card">
<h3>Activity</h3>
<div class="graph">
<div></div><div></div><div></div><div></div><div></div>
</div>
</div>

<div class="card">
<h3>Status</h3>
<p>🟢 Running Smoothly</p>
<p>⚡ AI Active</p>
</div>

</div>

<!-- JS -->
<script>
let text = "Deepfake Detection";
let i = 0;

function typing(){
if(i < text.length){
document.getElementById("typing").innerHTML += text.charAt(i);
i++;
setTimeout(typing, 70);
}
}
typing();
</script>

</body>
</html>
